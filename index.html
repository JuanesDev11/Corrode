<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>
            CORRODE
        </title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    
    <body>
        <header class="site-header">
            <h1>Apuesta seguro</h1>
            <div class="nav-bar">
                <a href="/">
                    <img src="assets/logo-corrode.png" alt="correde logo" class="site-logo">
                </a>
            </div>
        </header>
        <nav>
            <ul>
                <li> <a href="#"> Inicio</a></li>
                <li> <a href="#"> Futbol</a></li>
                <li> <a href="#"> Caballos</a></li>
            </ul>
        </nav>
        <main>
            <section>
                <h2>Encuentra tus jugadores favoritos</h2>
            </section>
            <section class="caja-imc">
                <h2>IMC</h2>
                
                <label for="estatura">Estatura (en metros):</label>
                <input type="number" id="estatura" step="0.01" placeholder="Ej. 1.75">
                <br><br>

                <label for="peso">Peso (en kg):</label>
                <input type="number" id="peso" step="0.1" placeholder="Ej. 70">
                <br><br>

                <button onclick="imc()">Calcular</button>

                <p id="Resultado">Resultado: </p>
            </section>
        </main>
        <footer>Esta pagina esta regulada por Coljuegos</footer>
        <script src="js/script.js"></script>
        <script src="js/masaCorporal.js"></script>
    </body>
</html>
